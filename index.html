<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <title>متجر افلام رشمات الطرز  | MED-STORE</title>
  
  <!-- Open Graph Meta Tags (باش تطلع الصورة والعنوان ملي تصيفط رابط الموقع فـ الواتساب/فيسبوك) -->
  <meta property="og:title" content="MED-STORE | متجر رشمات الطرز المبيكين">
  <meta property="og:description" content="أفضل رشمات الطرز افلام جاهزة للتحميل والتطريز المباشر">
  <meta property="og:image" content="https://mhdi2020casa-hash.github.io/MED-STORE/rashma2.jpg">
  <meta property="og:type" content="website">

  <!-- Favicon (أيقونة الموقع فالمتصفح) -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><circle cx=%2250%22 cy=%2250%22 r=%2245%22 fill=%22%23121212%22 stroke=%22%23D4AF37%22 stroke-width=%225%22/><text x=%2250%%22 y=%2257%%22 font-size=%2240%22 font-weight=%22900%22 fill=%22%23FBBF24%22 text-anchor=%22middle%22 dominant-baseline=%22middle%22 font-family=%22sans-serif%22>MD</text></svg>">

  <!-- Google Fonts & Tailwind CSS -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            cairo: ['Cairo', 'sans-serif'],
          },
          colors: {
            brand: {
              gold: '#D4AF37',
              dark: '#0A0A0A',
              card: '#121212',
              accent: '#1E1E1E'
            }
          }
        }
      }
    }
  </script>
  <style>
    body {
      font-family: 'Cairo', sans-serif;
      background-color: #0A0A0A;
      color: #E5E5E5;
    }
    .gold-gradient {
      background: linear-gradient(135deg, #FFF099 0%, #D4AF37 50%, #997A15 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .gold-btn {
      background: linear-gradient(135deg, #D4AF37 0%, #AA820A 100%);
      transition: all 0.3s ease;
    }
    .gold-btn:hover {
      background: linear-gradient(135deg, #E6C247 0%, #C4971A 100%);
      transform: translateY(-2px);
      box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between">

  <!-- Header Section -->
  <header class="border-b border-zinc-800 bg-brand-dark/90 backdrop-blur sticky top-0 z-50">
    <div class="max-w-6xl mx-auto px-4 py-4 flex flex-wrap items-center justify-between gap-4">
      <div class="flex items-center gap-3">
        <!-- Logo بدّلناه لـ MD -->
        <div class="w-10 h-10 rounded-full border border-yellow-600/50 flex items-center justify-center bg-zinc-900 shadow-md">
          <span class="text-lg font-black text-amber-400 tracking-tighter">MD</span>
        </div>
        <div>
          <h1 class="text-2xl font-black tracking-wide gold-gradient">MED-STORE</h1>
          <p class="text-xs text-zinc-400">متجر رشمات الطرز افلام الاحترافية</p>
        </div>
      </div>

      <!-- Search & Filters -->
      <div class="flex items-center gap-3 w-full sm:w-auto">
        <input 
          type="text" 
          id="searchInput" 
          placeholder="ابحث عن رشمة..." 
          class="w-full sm:w-64 bg-zinc-900 border border-zinc-800 text-sm px-4 py-2 rounded-lg focus:outline-none focus:border-amber-500 transition text-zinc-200"
        >
      </div>
    </div>
  </header>

  <!-- Hero Section -->
  <section class="py-12 px-4 text-center border-b border-zinc-800/50 bg-gradient-to-b from-zinc-900/50 to-brand-dark">
    <div class="max-w-3xl mx-auto space-y-4">
      <span class="inline-block px-3 py-1 bg-amber-500/10 border border-amber-500/20 text-amber-400 text-xs rounded-full font-bold">
        تشكيلة حصرية وحداثية
      </span>
      <h2 class="text-3xl sm:text-5xl font-extrabold text-white leading-tight">
        أفضل افلام <span class="gold-gradient">الطرز رشمات</span> وجاهزة للتحميل
      </h2>
      <p class="text-zinc-400 text-sm sm:text-base leading-relaxed">
        اختر الرشمة المناسبة لعملك، واطلبها مباشرة عبر الواتساب لتتوصل بملف التصميم بجودة عالية وسرعة فائقة.
      </p>
    </div>
  </section>

  <!-- Main Catalog -->
  <main class="max-w-6xl mx-auto px-4 py-10 flex-grow w-full">
    
    <!-- Category Tabs -->
    <div class="flex items-center justify-center gap-2 mb-8 flex-wrap" id="categoryFilter">
      <button onclick="filterCategory('all')" class="cat-btn active px-4 py-1.5 rounded-full text-xs font-bold border border-amber-500 bg-amber-500 text-black transition">الكل</button>
      <button onclick="filterCategory('جلابة')" class="cat-btn px-4 py-1.5 rounded-full text-xs font-bold border border-zinc-800 bg-zinc-900 text-zinc-400 hover:border-zinc-700 transition">جلابة</button>
      <button onclick="filterCategory('قفطان')" class="cat-btn px-4 py-1.5 rounded-full text-xs font-bold border border-zinc-800 bg-zinc-900 text-zinc-400 hover:border-zinc-700 transition">قفطان</button>
      <button onclick="filterCategory('عصري')" class="cat-btn px-4 py-1.5 rounded-full text-xs font-bold border border-zinc-800 bg-zinc-900 text-zinc-400 hover:border-zinc-700 transition">عصري</button>
    </div>

    <!-- Products Grid -->
    <div id="productsGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
      <!-- Products will be injected by JavaScript -->
    </div>

    <!-- Empty State -->
    <div id="noResults" class="hidden text-center py-16 text-zinc-500">
      <p class="text-lg">لم يتم العثور على أي رشمة بهذا الاسم.</p>
    </div>
  </main>

  <!-- Footer -->
  <footer class="border-t border-zinc-800 bg-zinc-950 py-6 text-center text-xs text-zinc-500">
    <p>© 2026 TARZ MBIKINE STORE. جميع الحقوق محفوظة.</p>
  </footer>

  <!-- App Data & Scripts -->
  <script>
    // -------------------------------------------------------------
    // CONFIGURATION: رقم الواتساب الخاص بك
    // -------------------------------------------------------------
    const WHATSAPP_NUMBER = "212702418961"; 

    // قائمة الرشمات
    const products = [
      {
        id: 1,
        title: "رشمة DST مبيكين",
        category: "جلابة",
        price: 50,
        image: "rashma2.jpg",
        desc: "رشمة أنيقة ومتقنة مخصصة لجلابة عصرية، متوفرة بملف جاهز للماكينة."
      },
      {
        id: 2,
        title: "رشمة مبيكين ملكية DTS",
        category: "قفطان",
        price: 50,
        image: "rashma3.jpg",
        desc: "تصميم فاخر وعريض يناسب القفاطين والمناسبات الكبرى بكثافة عالية."
      },
      {
        id: 3,
        title: "رشمة مبيكين ملكية DTS",
        category: "عصري",
        price: 50,
        image: "rashma4.jpg",
        desc: "رشمة طوق عصرية ومطلوبة جداً، سهلة التطريز ومناسبة لمختلف الأقمشة."
      },
      {
        id: 4,
        title: "رشمة مبيكين ملكية DTS",
        category: "جلابة",
        price: 50,
        image: "rashma5.jpg",
        desc: "رشمة خاصة بالأكمام والقب لجلابة تقليدية بروح عصرية."
      },
      {
        id: 5,
        title: "رشمة مبيكين ملكية DTS",
        category: "قفطان",
        price: 50,
        image: "rashma1.jpg",
        desc: "طقم رشمة متكامل يشمل الصدر"
      },
      {
        id: 6,
        title: "رشمة مبيكين بلمسة تقليدية",
        category: "عصري",
        price: 50,
        image: "rashma6.jpg",
        desc: "رشمة طوق عصرية ومطلوبة جداً، سهلة التطريز ومناسبة لمختلف الأقمشة"
      }
    ];

    let currentCategory = 'all';

    // Render Products
    function renderProducts(items) {
      const grid = document.getElementById('productsGrid');
      const noResults = document.getElementById('noResults');

      if (items.length === 0) {
        grid.innerHTML = '';
        noResults.classList.remove('hidden');
        return;
      }

      noResults.classList.add('hidden');
      grid.innerHTML = items.map(product => {
        const waMessage = encodeURIComponent(`السلام عليكم، بغيت نشري رشمة: ${product.title} (الثمن: ${product.price} درهم)`);
        const waLink = `https://wa.me/${WHATSAPP_NUMBER}?text=${waMessage}`;

        return `
          <div class="bg-brand-card border border-zinc-800/80 rounded-xl overflow-hidden hover:border-amber-500/50 transition duration-300 flex flex-col justify-between group">
            <div>
              <div class="relative overflow-hidden h-48 bg-zinc-900">
                <img 
                  src="${product.image}" 
                  alt="${product.title}" 
                  class="w-full h-full object-cover group-hover:scale-105 transition duration-500 opacity-90 group-hover:opacity-100"
                >
                <span class="absolute top-3 right-3 bg-zinc-950/80 backdrop-blur text-amber-400 text-xs font-bold px-2.5 py-1 rounded-md border border-amber-500/30">
                  ${product.category}
                </span>
              </div>
              <div class="p-5">
                <h3 class="text-lg font-bold text-white mb-2 group-hover:text-amber-400 transition">${product.title}</h3>
                <p class="text-zinc-400 text-xs leading-relaxed mb-4">${product.desc}</p>
              </div>
            </div>

            <div class="p-5 pt-0 flex items-center justify-between gap-4 border-t border-zinc-800/40 mt-auto">
              <div>
                <span class="text-xs text-zinc-500 block">الثمن</span>
                <span class="text-xl font-extrabold text-amber-400">${product.price} <span class="text-xs font-normal">د.م</span></span>
              </div>
              <a 
                href="${waLink}" 
                target="_blank" 
                class="gold-btn text-black font-extrabold px-4 py-2.5 rounded-lg text-xs flex items-center gap-2"
              >
                <span>طلب عبر واتساب</span>
                <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981zm11.387-5.464c-.074-.124-.272-.198-.57-.347-.297-.149-1.758-.868-2.031-.967-.272-.099-.47-.149-.669.149-.198.297-.768.967-.941 1.165-.173.198-.347.223-.644.074-.297-.149-1.255-.462-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.297-.347.446-.521.151-.172.2-.296.3-.495.099-.198.05-.372-.025-.521-.075-.148-.669-1.611-.916-2.206-.242-.579-.487-.501-.669-.51l-.57-.01c-.198 0-.52.074-.792.372s-1.04 1.016-1.04 2.479 1.065 2.876 1.213 3.074c.149.198 2.095 3.2 5.076 4.487.709.306 1.263.489 1.694.626.712.226 1.36.194 1.872.118.571-.085 1.758-.719 2.006-1.413.248-.695.248-1.29.173-1.414z"/></svg>
              </a>
            </div>
          </div>
        `;
      }).join('');
    }

    // Filter Logic
    function filterCategory(cat) {
      currentCategory = cat;
      
      // Update Active Button Style
      document.querySelectorAll('#categoryFilter button').forEach(btn => {
        btn.classList.remove('bg-amber-500', 'text-black', 'border-amber-500');
        btn.classList.add('bg-zinc-900', 'text-zinc-400', 'border-zinc-800');
      });
      event.target.classList.remove('bg-zinc-900', 'text-zinc-400', 'border-zinc-800');
      event.target.classList.add('bg-amber-500', 'text-black', 'border-amber-500');

      applyFilters();
    }

    function applyFilters() {
      const searchTerm = document.getElementById('searchInput').value.toLowerCase();
      
      const filtered = products.filter(p => {
        const matchesCategory = currentCategory === 'all' || p.category === currentCategory;
        const matchesSearch = p.title.toLowerCase().includes(searchTerm) || p.desc.toLowerCase().includes(searchTerm);
        return matchesCategory && matchesSearch;
      });

      renderProducts(filtered);
    }

    // Event Listeners
    document.getElementById('searchInput').addEventListener('input', applyFilters);

    // Initial Render
    renderProducts(products);
  </script>
</body>
</html>
